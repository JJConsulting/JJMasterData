name: NuGet Publish

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  nuget-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        project:
          - src/Html/JJConsulting.Html
          - src/Html/JJConsulting.Html.Bootstrap
          - src/Html/JJConsulting.Html.Bootstrap.TagHelpers
          - src/MasterData.Storage.Abstractions
          - src/MasterData.Data.SourceGenerator
          - src/MasterData.Commons
          - src/MasterData.Core
          - src/MasterData.Web
          - src/MasterData.WebApi
          - src/ConsoleApps/MasterData.CommandLine
          - src/Plugins/MasterData.Hangfire
          - src/Plugins/MasterData.Pdf
          - src/Plugins/MasterData.Brasil
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build NuGet package
        run: |
          cd ${{ matrix.project }}
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            VERSION_SUFFIX="rc.${{ github.event.pull_request.number }}.${{ github.run_number }}"
          else
            VERSION_SUFFIX=""
          fi
          dotnet build -c release -p:VersionSuffix="${VERSION_SUFFIX}" -p:ContinuousIntegrationBuild=true
          dotnet pack -c release --no-build --output="nuget" -p:VersionSuffix="${VERSION_SUFFIX}" -p:ContinuousIntegrationBuild=true

      - name: NuGet login
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet package
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        working-directory: ${{ matrix.project }}/nuget
        run: dotnet nuget push "*.nupkg" --api-key "${NUGET_API_KEY}" --source https://api.nuget.org/v3/index.json --skip-duplicate
